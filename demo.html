<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EvoLab Operations</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                background: #000;
                color: #fff;
                font-family: 'Manrope', sans-serif;
                -webkit-font-smoothing: antialiased;
                min-height: 100vh;
            }
            .display-font {
                font-family: 'Anton', sans-serif;
                letter-spacing: 0.01em;
            }
            input,
            textarea,
            select,
            button {
                font-family: inherit;
            }
            input[type='number']::-webkit-outer-spin-button,
            input[type='number']::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            input[type='number'] {
                -moz-appearance: textfield;
            }
            button {
                cursor: pointer;
                border: none;
                background: none;
                color: inherit;
            }
            input,
            textarea,
            select {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                color: #fff;
                border-radius: 8px;
                padding: 10px 14px;
                outline: none;
                width: 100%;
                transition: border-color 0.2s;
            }
            input:focus,
            textarea:focus,
            select:focus {
                border-color: #dc2626;
            }
            textarea {
                resize: none;
                min-height: 60px;
            }
            .hidden {
                display: none !important;
            }
            .red-dot {
                color: #dc2626;
            }
            .red-btn {
                background: #dc2626;
                color: #fff;
            }
            .red-btn:hover {
                background: #b91c1c;
            }
            .red-btn:disabled {
                background: rgba(220, 38, 38, 0.2);
                color: rgba(255, 255, 255, 0.3);
                cursor: not-allowed;
            }
            .white-btn {
                background: rgba(255, 255, 255, 0.1);
                color: #fff;
            }
            .white-btn:hover {
                background: rgba(255, 255, 255, 0.15);
            }
            .orange-btn {
                background: #ea580c;
                color: #fff;
            }
            .orange-btn:hover {
                background: #c2410c;
            }
            .label-tiny {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.25em;
                color: rgba(255, 255, 255, 0.5);
            }
            .card {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                padding: 16px;
            }
            .card-hover:hover {
                border-color: rgba(255, 255, 255, 0.2);
            }
            .header {
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding: 16px 20px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                position: sticky;
                top: 0;
                background: rgba(0, 0, 0, 0.95);
                backdrop-filter: blur(8px);
                z-index: 40;
            }
            .container {
                max-width: 480px;
                margin: 0 auto;
                padding: 0 20px;
            }
            .container-tight {
                max-width: 380px;
                margin: 0 auto;
                padding: 0 20px;
            }
            .badge {
                font-size: 9px;
                padding: 3px 6px;
                border-radius: 4px;
                letter-spacing: 0.1em;
                font-weight: 500;
            }
            .badge-dealer {
                background: rgba(220, 38, 38, 0.2);
                color: #ef4444;
            }
            .badge-priority {
                background: rgba(249, 115, 22, 0.2);
                color: #fb923c;
            }
            .badge-pending {
                background: rgba(255, 255, 255, 0.1);
                color: rgba(255, 255, 255, 0.6);
            }
            .badge-in_progress {
                background: rgba(220, 38, 38, 0.2);
                color: #ef4444;
            }
            .badge-awaiting_validation {
                background: rgba(234, 179, 8, 0.2);
                color: #eab308;
            }
            .badge-completed {
                background: rgba(34, 197, 94, 0.2);
                color: #22c55e;
            }
            .badge-rework {
                background: rgba(249, 115, 22, 0.2);
                color: #f97316;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }
            .pulse {
                animation: pulse 2s infinite;
            }
            .pulse-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #ef4444;
            }
            .modal-bg {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.9);
                backdrop-filter: blur(4px);
                z-index: 50;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding: 16px;
                overflow-y: auto;
            }
            .modal {
                background: #09090b;
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 16px;
                padding: 24px;
                width: 100%;
                max-width: 420px;
                margin-top: 40px;
            }
            .photo-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .photo-cell {
                aspect-ratio: 1;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 8px;
                overflow: hidden;
                position: relative;
            }
            .photo-cell img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .photo-remove {
                position: absolute;
                top: 4px;
                right: 4px;
                background: rgba(0, 0, 0, 0.7);
                border-radius: 50%;
                padding: 4px;
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
            }
            .photo-remove:hover {
                background: #dc2626;
            }
            .add-photo-btn {
                width: 100%;
                border: 1px dashed rgba(255, 255, 255, 0.2);
                border-radius: 8px;
                padding: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: rgba(255, 255, 255, 0.6);
                font-size: 14px;
            }
            .add-photo-btn:hover {
                border-color: #dc2626;
                background: rgba(220, 38, 38, 0.05);
                color: #fff;
            }
            .tab-btn {
                padding: 10px 16px;
                font-size: 11px;
                letter-spacing: 0.1em;
                border-bottom: 2px solid transparent;
                color: rgba(255, 255, 255, 0.4);
                white-space: nowrap;
            }
            .tab-btn.active {
                color: #fff;
                border-color: #dc2626;
            }
            .tab-btn .count {
                color: #ef4444;
                margin-left: 4px;
            }
            input[type='range'] {
                background: transparent;
                padding: 0;
                border: none;
                accent-color: #dc2626;
            }
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 3px;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <script>
            // ============= STATE =============
            const MANAGER_PASSWORD = 'evolab2026';

            const DEMO_SEED = [
                {
                    id: 'EVO-2401',
                    customer: 'M. Khan',
                    phone: '(416) 555-0142',
                    vehicle: '2023 BMW X5 M50i',
                    color: 'Carbon Black',
                    plate: 'CKHN 482',
                    service: 'EVO SPEC-2',
                    notes: 'Pet hair in trunk and rear seats.',
                    source: 'Retail',
                    status: 'pending',
                    priority: 'normal',
                    dueDate: 'Today 4:00 PM',
                },
                {
                    id: 'EVO-2402',
                    customer: 'S. Patel',
                    phone: '(905) 555-0198',
                    vehicle: '2022 Audi RS6 Avant',
                    color: 'Nardo Gray',
                    plate: 'RS6 GTA',
                    service: 'Stage 1 Paint Correction',
                    notes: 'Light swirls on hood. Two-stage polish.',
                    source: 'Retail',
                    status: 'pending',
                    priority: 'high',
                    dueDate: 'Today 6:00 PM',
                },
                {
                    id: 'EVO-2403',
                    customer: 'Performance Auto',
                    phone: '(905) 555-0287',
                    vehicle: '2024 Porsche 911 GT3',
                    color: 'Shark Blue',
                    plate: 'GT3 911',
                    service: '5-Year Ceramic',
                    notes: 'Dealer prep. Showroom condition.',
                    source: 'Dealer',
                    status: 'pending',
                    priority: 'high',
                    dueDate: 'Tomorrow 10:00 AM',
                },
                {
                    id: 'EVO-2404',
                    customer: 'D. Chen',
                    phone: '(647) 555-0319',
                    vehicle: '2024 Tesla Model 3',
                    color: 'Stealth Grey',
                    plate: 'EV-3PFR',
                    service: 'EVO SPEC-1',
                    notes: 'Light maintenance only.',
                    source: 'Retail',
                    status: 'pending',
                    priority: 'normal',
                    dueDate: 'Tomorrow 2:00 PM',
                },
                {
                    id: 'EVO-2405',
                    customer: 'Lakeview Motors',
                    phone: '(905) 555-0156',
                    vehicle: '2023 Mercedes G63 AMG',
                    color: 'Obsidian Black',
                    plate: 'G63 LKV',
                    service: 'EVO SPEC-2',
                    notes: 'Pre-delivery prep for new owner.',
                    source: 'Dealer',
                    status: 'pending',
                    priority: 'normal',
                    dueDate: 'Tomorrow 5:00 PM',
                },
            ];

            let state = {
                view: 'login',
                currentUser: null,
                punchedIn: false,
                punchTime: null,
                activeJob: null,
                jobs: DEMO_SEED,
                now: Date.now(),
            };

            // Safe localStorage wrapper
            const storage = {
                get: (k) => {
                    try {
                        return localStorage.getItem('evolab_' + k);
                    } catch (e) {
                        return null;
                    }
                },
                set: (k, v) => {
                    try {
                        localStorage.setItem('evolab_' + k, v);
                    } catch (e) {}
                },
                remove: (k) => {
                    try {
                        localStorage.removeItem('evolab_' + k);
                    } catch (e) {}
                },
            };

            function loadState() {
                try {
                    const u = storage.get('currentUser');
                    if (u) {
                        state.currentUser = JSON.parse(u);
                        state.view =
                            state.currentUser.role === 'manager'
                                ? 'manager'
                                : 'dashboard';
                    }
                    const p = storage.get('punchedIn');
                    if (p) {
                        const d = JSON.parse(p);
                        state.punchedIn = d.punchedIn;
                        state.punchTime = d.punchTime;
                    }
                    const a = storage.get('activeJob');
                    if (a) state.activeJob = JSON.parse(a);
                    const j = storage.get('jobs');
                    if (j) state.jobs = JSON.parse(j);
                    else storage.set('jobs', JSON.stringify(DEMO_SEED));
                } catch (e) {
                    console.warn('Load error', e);
                }
            }

            function saveJobs() {
                storage.set('jobs', JSON.stringify(state.jobs));
            }
            function saveUser() {
                state.currentUser
                    ? storage.set(
                          'currentUser',
                          JSON.stringify(state.currentUser),
                      )
                    : storage.remove('currentUser');
            }
            function savePunch() {
                storage.set(
                    'punchedIn',
                    JSON.stringify({
                        punchedIn: state.punchedIn,
                        punchTime: state.punchTime,
                    }),
                );
            }
            function saveActiveJob() {
                state.activeJob
                    ? storage.set('activeJob', JSON.stringify(state.activeJob))
                    : storage.remove('activeJob');
            }

            // ============= HELPERS =============
            function formatDuration(ms) {
                if (!ms || ms < 0) return '00:00:00';
                const s = Math.floor(ms / 1000);
                const h = Math.floor(s / 3600),
                    m = Math.floor((s % 3600) / 60),
                    sec = s % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
            }
            function formatTime(ts) {
                return new Date(ts).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                });
            }
            function esc(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function statusBadge(status) {
                const labels = {
                    pending: 'PENDING',
                    in_progress: 'IN PROGRESS',
                    awaiting_validation: 'PENDING REVIEW',
                    completed: 'APPROVED',
                    rework: 'REWORK',
                };
                return `<span class="badge badge-${status}">${labels[status] || 'PENDING'}</span>`;
            }

            // ============= RENDER =============
            function render() {
                const app = document.getElementById('app');
                if (state.view === 'login') app.innerHTML = renderLogin();
                else if (state.view === 'manager')
                    app.innerHTML = renderManager();
                else if (state.view === 'checkin' && state.activeJob)
                    app.innerHTML = renderCheckin();
                else if (state.view === 'job' && state.activeJob)
                    app.innerHTML = renderJob();
                else app.innerHTML = renderDashboard();
                attachHandlers();
            }

            // ============= LOGIN =============
            function renderLogin() {
                return `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div class="container-tight" style="width:100%;">
      <div style="text-align:center;margin-bottom:40px;">
        <div class="display-font" style="font-size:60px;margin-bottom:8px;">EVO<span class="red-dot">.</span>LAB</div>
        <div class="label-tiny">Operations App</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div>
          <label class="label-tiny" style="display:block;margin-bottom:8px;letter-spacing:0.25em;">YOUR NAME</label>
          <input id="login-name" type="text" placeholder="e.g. Adam" autocomplete="off" />
        </div>
        <div>
          <label class="label-tiny" style="display:block;margin-bottom:8px;letter-spacing:0.25em;">ROLE</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button class="role-btn" data-role="technician" style="padding:12px;border-radius:8px;border:1px solid #DC2626;background:#DC2626;font-size:14px;">Technician</button>
            <button class="role-btn" data-role="manager" style="padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);font-size:14px;">🔒 Manager</button>
          </div>
        </div>
        <div id="password-section" class="hidden">
          <label class="label-tiny" style="display:block;margin-bottom:8px;">Manager Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="off" />
          <div id="pw-error" class="hidden" style="font-size:12px;color:#EF4444;margin-top:6px;">Incorrect password</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:6px;">Demo: evolab2026</div>
        </div>
        <button id="login-submit" class="red-btn display-font" style="padding:16px;border-radius:12px;font-size:18px;letter-spacing:0.15em;margin-top:16px;" disabled>ENTER</button>
      </div>
      <div style="text-align:center;font-size:10px;color:rgba(255,255,255,0.3);margin-top:32px;letter-spacing:0.1em;">DEMO BUILD · v0.3</div>
    </div>
  </div>`;
            }

            // ============= DASHBOARD =============
            function renderDashboard() {
                const u = state.currentUser;
                const pending = state.jobs.filter(
                    (j) => j.status === 'pending',
                );
                const myCompleted = state.jobs.filter(
                    (j) =>
                        (j.status === 'completed' ||
                            j.status === 'awaiting_validation' ||
                            j.status === 'rework') &&
                        j.startedBy === u?.name,
                );
                const rework = state.jobs.filter(
                    (j) => j.status === 'rework' && j.startedBy === u?.name,
                );
                const elapsed = state.punchedIn
                    ? state.now - state.punchTime
                    : 0;

                return `
  <header class="header">
    <div>
      <div class="display-font" style="font-size:24px;line-height:1;">EVO<span class="red-dot">.</span>LAB</div>
      <div class="label-tiny" style="margin-top:4px;">${esc((u?.name || 'USER').toUpperCase())} · TECHNICIAN</div>
    </div>
    <button id="logout-btn" style="color:rgba(255,255,255,0.4);padding:8px;font-size:14px;">⎋</button>
  </header>
  <main class="container" style="padding-top:24px;padding-bottom:80px;">
    <section style="border-radius:16px;border:1px solid ${state.punchedIn ? 'rgba(220,38,38,0.4)' : 'rgba(255,255,255,0.1)'};background:${state.punchedIn ? 'rgba(220,38,38,0.1)' : 'rgba(255,255,255,0.03)'};padding:20px;margin-bottom:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="label-tiny">Shift</div>
        ${state.punchedIn ? '<div style="display:flex;align-items:center;gap:6px;color:#EF4444;font-size:12px;"><div class="pulse-dot pulse"></div><span>ACTIVE</span></div>' : ''}
      </div>
      ${
          state.punchedIn
              ? `<div class="display-font" style="font-size:36px;line-height:1;margin-bottom:4px;">${formatDuration(elapsed)}</div>
           <div style="font-size:12px;color:rgba(255,255,255,0.5);">Punched in at ${formatTime(state.punchTime)}</div>`
              : `<div class="display-font" style="font-size:22px;color:rgba(255,255,255,0.4);margin-bottom:4px;">NOT PUNCHED IN</div>`
      }
      <button id="punch-btn" class="${state.punchedIn ? 'white-btn' : 'red-btn'} display-font" style="width:100%;margin-top:16px;padding:12px;border-radius:12px;letter-spacing:0.15em;font-size:14px;">
        ${state.punchedIn ? 'PUNCH OUT' : 'PUNCH IN'}
      </button>
    </section>

    ${
        state.activeJob
            ? `
    <button id="resume-job" class="red-btn" style="width:100%;border-radius:16px;padding:16px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
      <div style="min-width:0;flex:1;">
        <div class="label-tiny" style="color:rgba(255,255,255,0.7);margin-bottom:4px;">${state.activeJob.status === 'in_progress' ? 'Active Job' : 'Continue Check-In'}</div>
        <div class="display-font" style="font-size:20px;">${esc(state.activeJob.vehicle)}</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:4px;">${esc(state.activeJob.service)}${state.activeJob.startedAt ? ' · ' + formatDuration(state.now - state.activeJob.startedAt) : ''}</div>
      </div>
      <div style="font-size:24px;">›</div>
    </button>`
            : ''
    }

    ${
        rework.length > 0
            ? `
    <div style="background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);border-radius:12px;padding:16px;margin-bottom:24px;">
      <div style="display:flex;align-items:center;gap:8px;color:#FB923C;font-size:14px;font-weight:600;margin-bottom:8px;">⚠️ ${rework.length} Job${rework.length > 1 ? 's' : ''} Sent Back</div>
      ${rework
          .map(
              (j) => `
        <div style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:8px;">
          <div style="font-weight:500;color:#fff;">${esc(j.vehicle)}</div>
          <div style="font-style:italic;margin-top:2px;">"${esc(j.rejectionReason)}"</div>
        </div>`,
          )
          .join('')}
    </div>`
            : ''
    }

    <section style="margin-bottom:32px;">
      <div class="label-tiny" style="margin-bottom:12px;">Job Queue (${pending.length})</div>
      ${
          pending.length === 0
              ? '<div style="color:rgba(255,255,255,0.3);font-size:14px;padding:32px;text-align:center;border:1px dashed rgba(255,255,255,0.1);border-radius:12px;">No jobs in queue.</div>'
              : pending.map(renderJobCard).join('')
      }
    </section>

    ${
        myCompleted.length > 0
            ? `
    <section>
      <div class="label-tiny" style="margin-bottom:12px;">My Recent (${myCompleted.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${myCompleted
            .map(
                (j) => `
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;">
            <div style="min-width:0;flex:1;">
              <div style="font-size:14px;">${esc(j.vehicle)}</div>
              <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">${esc(j.service)}${j.duration ? ' · ' + formatDuration(j.duration) : ''}</div>
            </div>
            ${statusBadge(j.status)}
          </div>`,
            )
            .join('')}
      </div>
    </section>`
            : ''
    }
  </main>`;
            }

            function renderJobCard(job) {
                const priorityBorder =
                    job.priority === 'high'
                        ? '#DC2626'
                        : 'rgba(255,255,255,0.2)';
                return `
  <div class="card card-hover" style="border-left:4px solid ${priorityBorder};margin-bottom:8px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;">
      <div style="min-width:0;flex:1;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
          <div style="font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.05em;">${esc(job.id)}</div>
          ${job.source === 'Dealer' ? '<span class="badge badge-dealer">DEALER</span>' : ''}
          ${job.priority === 'high' ? '<span class="badge badge-priority">PRIORITY</span>' : ''}
        </div>
        <div class="display-font" style="font-size:18px;line-height:1.2;">${esc(job.vehicle)}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;">${esc(job.color)} · ${esc(job.plate)}</div>
      </div>
    </div>
    <div style="font-size:12px;color:#EF4444;font-weight:500;margin-bottom:4px;">${esc(job.service)}</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:8px;">${esc(job.customer)}</div>
    ${job.notes ? `<div style="font-size:11px;color:rgba(255,255,255,0.4);font-style:italic;margin-bottom:12px;">"${esc(job.notes)}"</div>` : ''}

                const job = state.activeJob;

                    c.mileage &&
                    c.keysReceived === true &&
                    c.exteriorPhotos.length >= 1 &&

                    (j) => j.status === 'in_progress',
                );
                const pending = state.jobs.filter(
                    (j) => j.status === 'pending',
                );
                const recent = state.jobs
                    .filter(
                        (j) =>
                            j.status === 'completed' || j.status === 'rework',
                    )
                    .slice(-10)
                    .reverse();
                const completed = state.jobs.filter(
                    (j) => j.status === 'completed',
                ).length;

                let tabJobs = [];
                let emptyMsg = '';
                if (managerTab === 'review') {
                    tabJobs = awaiting;
                    emptyMsg = 'Nothing to review.';

                    tabJobs = inProgress;
                    emptyMsg = 'Nothing in progress.';
                } else if (managerTab === 'queue') {
                    tabJobs = pending;
                    emptyMsg = 'Queue is empty.';
                } else if (managerTab === 'history') {

          (job.beforePhotos || []).length > 0
              ? `
        <div style="margin-bottom:16px;">
          <div class="label-tiny" style="margin-bottom:8px;">Before (${job.beforePhotos.length})</div>
          <div class="photo-grid">${job.beforePhotos.map((p) => `<div class="photo-cell"><img src="${p.data}" /></div>`).join('')}</div>
        </div>`
              : ''
      }

      ${
          (job.afterPhotos || []).length > 0
              ? `
        <div style="margin-bottom:24px;">
          <div class="label-tiny" style="margin-bottom:8px;">After (${job.afterPhotos.length})</div>
          <div class="photo-grid">${job.afterPhotos.map((p) => `<div class="photo-cell"><img src="${p.data}" /></div>`).join('')}</div>
        </div>`
              : ''
      }

      ${
          job.status === 'awaiting_validation'
              ? `
        <div id="reject-form" class="hidden" style="display:flex;flex-direction:column;gap:12px;">
          <textarea id="reject-reason" rows="3" placeholder="What needs to be fixed?"></textarea>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button id="cancel-reject" class="white-btn" style="padding:12px;border-radius:8px;font-size:14px;">Cancel</button>
            <button id="confirm-reject" class="orange-btn display-font" style="padding:12px;border-radius:8px;font-size:14px;letter-spacing:0.1em;">SEND BACK</button>
          </div>
        </div>
        <div id="approve-buttons" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button id="show-reject" class="white-btn display-font" style="padding:12px;border-radius:8px;font-size:14px;letter-spacing:0.1em;">✕ REWORK</button>
          <button id="approve-job" class="red-btn display-font" style="padding:12px;border-radius:8px;font-size:14px;letter-spacing:0.1em;">✓ APPROVE</button>
        </div>`
              : ''
      }
    </div>
  </div>`;
            }

            // ============= HANDLERS =============
            let loginRole = 'technician';

            function attachHandlers() {
                // LOGIN
                const loginName = document.getElementById('login-name');
                const loginPassword = document.getElementById('login-password');
                const loginSubmit = document.getElementById('login-submit');
                if (loginName) {
                    loginName.addEventListener('input', updateLoginSubmit);
                    loginName.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') tryLogin();
                    });
                }
                if (loginPassword) {
                    loginPassword.addEventListener('input', updateLoginSubmit);
                    loginPassword.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') tryLogin();
                    });
                }
                document.querySelectorAll('.role-btn').forEach((b) => {
                    b.addEventListener('click', () => {
                        loginRole = b.dataset.role;
                        document.querySelectorAll('.role-btn').forEach((x) => {
                            x.style.background =
                                x.dataset.role === loginRole
                                    ? '#DC2626'
                                    : 'rgba(255,255,255,0.05)';
                            x.style.borderColor =
                                x.dataset.role === loginRole
                                    ? '#DC2626'
                                    : 'rgba(255,255,255,0.1)';
                        });
                        document
                            .getElementById('password-section')
                            .classList.toggle(
                                'hidden',
                                loginRole !== 'manager',
                            );
                        updateLoginSubmit();
                    });
                });
                if (loginSubmit)
                    loginSubmit.addEventListener('click', tryLogin);

                // LOGOUT
                document
                    .getElementById('logout-btn')
                    ?.addEventListener('click', () => {
                        state.currentUser = null;
                        saveUser();
                        state.view = 'login';
                        render();
                    });

                // PUNCH
                document
                    .getElementById('punch-btn')
                    ?.addEventListener('click', () => {
                        state.punchedIn = !state.punchedIn;
                        state.punchTime = state.punchedIn ? Date.now() : null;
                        savePunch();
                        render();
                    });

                // START JOB
                document.querySelectorAll('.start-job').forEach((b) => {
                    b.addEventListener('click', () => {
                        if (state.activeJob) return;
                        if (!state.punchedIn) {
                            alert('Punch in before starting a job.');
                            return;
                        }
                        const job = state.jobs.find(
                            (j) => j.id === b.dataset.jobId,
                        );
                        if (!job) return;
                        state.activeJob = job;
                        saveActiveJob();
                        initCheckin();
                        state.view = 'checkin';
                        render();
                    });
                });

                document
                    .getElementById('resume-job')
                    ?.addEventListener('click', () => {
                        state.view =
                            state.activeJob.status === 'in_progress'
                                ? 'job'
                                : 'checkin';
                        render();
                    });

                // CHECK-IN
                document
                    .getElementById('cancel-checkin')
                    ?.addEventListener('click', () => {
                        state.activeJob = null;
                        saveActiveJob();
                        checkinData = null;
                        state.view = 'dashboard';
                        render();
                    });

                const mileage = document.getElementById('ci-mileage');
                if (mileage)
                    mileage.addEventListener('input', () => {
                        checkinData.mileage = mileage.value;
                        updateCheckinSubmit();
                    });

                const fuel = document.getElementById('ci-fuel');
                if (fuel)
                    fuel.addEventListener('input', () => {
                        checkinData.fuelLevel = fuel.value;
                        render();
                    });

                document.querySelectorAll('.ci-keys-btn').forEach((b) => {
                    b.addEventListener('click', () => {
                        checkinData.keysReceived = b.dataset.val === 'true';
                        render();
                    });
                });

                document.querySelectorAll('.ci-keycount').forEach((b) => {
                    b.addEventListener('click', () => {
                        checkinData.keyCount = b.dataset.val;
                        render();
                    });
                });

                const items = document.getElementById('ci-items');
                if (items)
                    items.addEventListener('input', () => {
                        checkinData.personalItems = items.value;
                    });

                const expect = document.getElementById('ci-expectations');
                if (expect)
                    expect.addEventListener('input', () => {
                        checkinData.customerExpectations = expect.value;
                    });

                document.querySelectorAll('.ci-add-photo').forEach((b) => {
                    b.addEventListener('click', () =>
                        triggerPhotoCapture(b.dataset.type),
                    );
                });

                document.querySelectorAll('.rm-photo').forEach((b) => {
                    b.addEventListener('click', () => {
                        const type = b.dataset.type,
                            i = parseInt(b.dataset.i);
                        if (type === 'after') {
                            state.activeJob.afterPhotos.splice(i, 1);
                            saveActiveJob();
                            saveJobs();
                        } else {
                            const key = type + 'Photos';
                            checkinData[key].splice(i, 1);
                        }
                        render();
                    });
                });

                document.querySelectorAll('.rm-damage').forEach((b) => {
                    b.addEventListener('click', () => {
                        checkinData.damageNotes.splice(
                            parseInt(b.dataset.i),
                            1,
                        );
                        render();
                    });
                });

                document
                    .getElementById('add-damage')
                    ?.addEventListener('click', () => {
                        const loc = prompt(
                            'Damage location (Front Bumper / Hood / Wheels / Interior / etc.)',
                        );
                        if (!loc) return;
                        const desc = prompt('Damage description');
                        if (!desc) return;
                        checkinData.damageNotes.push({
                            location: loc,
                            description: desc,
                            timestamp: Date.now(),
                        });
                        render();
                    });

                document
                    .getElementById('complete-checkin')
                    ?.addEventListener('click', () => {
                        const job = state.activeJob;
                        state.activeJob = {
                            ...job,
                            status: 'in_progress',
                            startedAt: Date.now(),
                            startedBy: state.currentUser.name,
                            checkin: checkinData,
                            beforePhotos: [
                                ...checkinData.exteriorPhotos,
                                ...checkinData.interiorPhotos,
                            ],
                            afterPhotos: [],
                            progressNotes: [],
                        };
                        state.jobs = state.jobs.map((j) =>
                            j.id === state.activeJob.id ? state.activeJob : j,
                        );
                        saveJobs();
                        saveActiveJob();
                        checkinData = null;
                        state.view = 'job';
                        render();
                    });

                // JOB VIEW
                document
                    .getElementById('back-dashboard')
                    ?.addEventListener('click', () => {
                        state.view = 'dashboard';
                        render();
                    });

                document
                    .getElementById('add-note')
                    ?.addEventListener('click', () => {
                        const text = prompt('Progress note');
                        if (!text) return;
                        state.activeJob.progressNotes = [
                            ...(state.activeJob.progressNotes || []),
                            { text, timestamp: Date.now() },
                        ];
                        state.jobs = state.jobs.map((j) =>
                            j.id === state.activeJob.id ? state.activeJob : j,
                        );
                        saveJobs();
                        saveActiveJob();
                        render();
                    });

                document
                    .getElementById('complete-job')
                    ?.addEventListener('click', () => {
                        if (
                            !state.activeJob.afterPhotos ||
                            state.activeJob.afterPhotos.length === 0
                        ) {
                            alert('At least 1 AFTER photo required.');
                            return;
                        }
                        const completed = {
                            ...state.activeJob,
                            status: 'awaiting_validation',
                            completedAt: Date.now(),
                            duration: Date.now() - state.activeJob.startedAt,
                        };
                        state.jobs = state.jobs.map((j) =>
                            j.id === completed.id ? completed : j,
                        );
                        state.activeJob = null;
                        saveJobs();
                        saveActiveJob();
                        state.view = 'dashboard';
                        render();
                    });

                // MANAGER
                document.querySelectorAll('.tab-btn').forEach((b) => {
                    b.addEventListener('click', () => {
                        managerTab = b.dataset.tab;
                        render();
                    });
                });

                document.querySelectorAll('.mgr-job-card').forEach((card) => {
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.card-actions')) return;
                        selectedJobId = card.dataset.id;
                        render();
                    });
                });

                document.querySelectorAll('.quick-rework').forEach((b) => {
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectedJobId = b.dataset.id;
                        const reason = prompt('What needs to be fixed?');
                        if (reason === null) {
                            selectedJobId = null;
                            return;
                        }
                        validateJob(
                            false,
                            reason.trim() || 'Rework requested by manager.',
                        );
                    });
                });

                document.querySelectorAll('.quick-approve').forEach((b) => {
                    b.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectedJobId = b.dataset.id;
                        validateJob(true);
                    });
                });

                document
                    .getElementById('close-modal')
                    ?.addEventListener('click', () => {
                        selectedJobId = null;
                        render();
                    });
                document
                    .getElementById('modal-overlay')
                    ?.addEventListener('click', () => {
                        selectedJobId = null;
                        render();
                    });

                document
                    .getElementById('approve-job')
                    ?.addEventListener('click', () => validateJob(true));
                document
                    .getElementById('show-reject')
                    ?.addEventListener('click', () => {
                        document
                            .getElementById('approve-buttons')
                            .classList.add('hidden');
                        document
                            .getElementById('reject-form')
                            .classList.remove('hidden');
                        document.getElementById('reject-reason').focus();
                    });
                document
                    .getElementById('cancel-reject')
                    ?.addEventListener('click', () => {
                        document
                            .getElementById('approve-buttons')
                            .classList.remove('hidden');
                        document
                            .getElementById('reject-form')
                            .classList.add('hidden');
                    });
                document
                    .getElementById('confirm-reject')
                    ?.addEventListener('click', () => {
                        const reason = document
                            .getElementById('reject-reason')
                            .value.trim();
                        if (!reason) return;
                        validateJob(false, reason);
                    });

                document
                    .getElementById('reset-demo')
                    ?.addEventListener('click', () => {
                        if (!confirm('Reset all demo data?')) return;
                        state.jobs = JSON.parse(JSON.stringify(DEMO_SEED));
                        state.activeJob = null;
                        state.punchedIn = false;
                        state.punchTime = null;
                        saveJobs();
                        saveActiveJob();
                        savePunch();
                        render();
                    });
            }

            function validateJob(approved, reason) {
                state.jobs = state.jobs.map((j) =>
                    j.id !== selectedJobId
                        ? j
                        : {
                              ...j,
                              status: approved ? 'completed' : 'rework',
                              validatedAt: Date.now(),
                              validatedBy: state.currentUser.name,
                              rejectionReason: approved ? null : reason,
                          },
                );
                saveJobs();
                selectedJobId = null;
                render();
            }

            function updateLoginSubmit() {
                const name = document
                    .getElementById('login-name')
                    ?.value.trim();
                const password =
                    document.getElementById('login-password')?.value;
                const submit = document.getElementById('login-submit');
                if (!submit) return;
                submit.disabled =
                    !name || (loginRole === 'manager' && !password);
            }

            function tryLogin() {
                const name = document.getElementById('login-name').value.trim();
                if (!name) return;
                if (loginRole === 'manager') {
                    const pw = document.getElementById('login-password').value;
                    if (pw !== MANAGER_PASSWORD) {
                        document
                            .getElementById('pw-error')
                            .classList.remove('hidden');
                        return;
                    }
                }
                state.currentUser = {
                    name,
                    role: loginRole,
                    id: Date.now().toString(),
                };
                saveUser();
                state.view = loginRole === 'manager' ? 'manager' : 'dashboard';
                render();
            }

            function updateCheckinSubmit() {
                const c = checkinData;
                const canFinish =
                    c.mileage &&
                    c.keysReceived === true &&
                    c.exteriorPhotos.length >= 1 &&
                    c.interiorPhotos.length >= 1;
                const btn = document.getElementById('complete-checkin');
                if (btn) btn.disabled = !canFinish;
            }

            // PHOTO CAPTURE
            function triggerPhotoCapture(type) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.capture = 'environment';
                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const maxDim = 1200;
                            let { width, height } = img;
                            if (width > height && width > maxDim) {
                                height = (height / width) * maxDim;
                                width = maxDim;
                            } else if (height > maxDim) {
                                width = (width / height) * maxDim;
                                height = maxDim;
                            }
                            canvas.width = width;
                            canvas.height = height;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                            if (type === 'after') {
                                state.activeJob.afterPhotos = [
                                    ...(state.activeJob.afterPhotos || []),
                                    { data: dataUrl, timestamp: Date.now() },
                                ];
                                state.jobs = state.jobs.map((j) =>
                                    j.id === state.activeJob.id
                                        ? state.activeJob
                                        : j,
                                );
                                saveJobs();
                                saveActiveJob();
                            } else {
                                const key = type + 'Photos';
                                checkinData[key] = [
                                    ...(checkinData[key] || []),
                                    { data: dataUrl, timestamp: Date.now() },
                                ];
                                updateCheckinSubmit();
                            }
                            render();
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                input.click();
            }

            // Initialize App
            loadState();

            // Clock update
            setInterval(() => {
                state.now = Date.now();
                if (
                    (state.view === 'dashboard' && state.punchedIn) ||
                    (state.view === 'job' && state.activeJob)
                ) {
                    render();
                }
            }, 1000);

            render();
        </script>
    </body>
</html>
